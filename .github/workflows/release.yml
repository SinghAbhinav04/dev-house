name: Release

# Push a tag like v0.4.4 to cut a release:
#
#   git tag v0.4.4 && git push origin v0.4.4
#
# The tag has to match the version in package.json, and the same checks CI
# runs have to pass, before anything is published.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - name: Tag matches package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match package.json version $version"
            exit 1
          fi

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that can write, and only to create the release.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7

      # Use this version's section of CHANGELOG.md ("## 0.4.4" or "## v0.4.4")
      # as the release notes when there is one, GitHub's generated notes when
      # there is not.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            /^## / { if (found) exit; h=$2; sub(/^v/, "", h); if (h == v) { found=1; next } }
            found { print }
          ' CHANGELOG.md > notes.md

          if [ -s notes.md ]; then
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
          else
            gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
          fi
