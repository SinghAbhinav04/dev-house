name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only by default. Nothing in CI needs to write to the repo, and a PR
# from a fork must not get a token that can.
permissions:
  contents: read

# A new push to the same PR or branch cancels the run it makes stale.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The ruleset on main requires this job by its id, "check".
  # Renaming it means updating .github/rulesets/main-review.json too.
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # No version pinned here on purpose — it reads `packageManager` from
      # package.json, so CI uses whatever the repo says it uses and the two
      # cannot drift apart again.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          # The test suite imports .ts sources directly via
          # --experimental-strip-types, which needs a recent Node.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Runs every scripts/test-*.mjs, including the hook contract test, which
      # drives the real shell script against a temporary $HOME. That one is the
      # security boundary, so a failure here is not a flake.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
