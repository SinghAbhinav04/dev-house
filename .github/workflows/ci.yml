name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          # The test suite imports .ts sources directly via
          # --experimental-strip-types, which needs a recent Node.
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Runs every scripts/test-*.mjs, including the hook contract test, which
      # drives the real shell script against a temporary $HOME. That one is the
      # security boundary, so a failure here is not a flake.
      - name: Test
        run: npm test

      - name: Build
        run: npm run build
