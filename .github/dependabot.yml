version: 2
updates:
  # The actions the workflows use.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # npm dependencies, batched into one PR a week so they do not drown the
  # queue. Security updates still come on their own, as soon as they are out.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Matches the oldest Node the app supports (engines in package.json, and
      # CI), not the newest Node there is. Types for a newer major would let
      # code use APIs that crash on 22. Raise it together with engines.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      dependencies:
        patterns: ['*']
        update-types: [minor, patch]
