version: 2
updates:
  # The actions the workflows use.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  # npm dependencies, batched into one PR a week so they do not drown the
  # queue. Security updates still come on their own, as soon as they are out.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dependencies:
        patterns: ['*']
        update-types: [minor, patch]
